<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070D" />
      <stop offset="50%" stop-color="#0E0E18" />
      <stop offset="100%" stop-color="#141422" />
    </linearGradient>
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65E5BF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowMint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes neonPulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px rgba(101, 229, 191, 0.5)); }
        50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.8)); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes particleFloat {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-8px) scale(1.3); opacity: 0.9; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      .pulsing-logo {
        animation: neonPulse 3.5s ease-in-out infinite;
      }
      .dashed-path {
        stroke-dasharray: 8, 8;
        animation: dashMove 2s linear infinite;
      }
      .p1 { animation: particleFloat 4s ease-in-out infinite; }
      .p2 { animation: particleFloat 5s ease-in-out infinite 1.5s; }
      .p3 { animation: particleFloat 3.5s ease-in-out infinite 0.7s; }
      .scan { animation: scanline 4s linear infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="236" rx="20" fill="url(#bgGrad)" stroke="#232336" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#65E5BF" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="280" y1="0" x2="280" y2="240" />
    <line x1="360" y1="0" x2="360" y2="240" />
    <line x1="440" y1="0" x2="440" y2="240" />
    <line x1="520" y1="0" x2="520" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="680" y1="0" x2="680" y2="240" />
    <line x1="760" y1="0" x2="760" y2="240" />
    <line x1="840" y1="0" x2="840" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Animated Neon Border Accent -->
  <rect x="4" y="4" width="892" height="232" rx="18" fill="none" stroke="url(#neonMint)" stroke-width="1" opacity="0.4" class="dashed-path" />

  <!-- Glowing Particles -->
  <circle cx="160" cy="50" r="3" fill="#65E5BF" class="p1" />
  <circle cx="780" cy="70" r="2.5" fill="#38BDF8" class="p2" />
  <circle cx="820" cy="180" r="3" fill="#818CF8" class="p3" />
  <circle cx="220" cy="190" r="2" fill="#65E5BF" class="p2" />
  <circle cx="580" cy="35" r="2" fill="#38BDF8" class="p1" />

  <!-- Logo Mark -->
  <g transform="translate(65, 45)" class="pulsing-logo">
    <rect width="80" height="80" rx="20" fill="#12121E" stroke="#2C2C40" stroke-width="1.5" />
    <!-- V Shape with Neon Gradient -->
    <path d="M22 24 L40 60 L58 24" fill="none" stroke="url(#neonMint)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lightning Bolt / Energy Accent -->
    <path d="M40 32 L34 46 L46 44 L40 58" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: Brand Title -->
  <text x="175" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    VELORA
  </text>

  <!-- Brand Subtitle / Tagline -->
  <text x="178" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" letter-spacing="1.5" fill="#94A3B8">
    NEXT-GEN WINDOWS VPN &amp; ANTI-CENSORSHIP SUITE
  </text>

  <!-- Feature Pills / Badges in Banner -->
  <!-- Badge 1: VLESS Reality -->
  <g transform="translate(178, 150)">
    <rect width="138" height="32" rx="10" fill="#141824" stroke="#283548" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#65E5BF" />
    <text x="28" y="21" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">VLESS REALITY</text>
  </g>

  <!-- Badge 2: Zapret WinWS -->
  <g transform="translate(326, 150)">
    <rect width="138" height="32" rx="10" fill="#141824" stroke="#283548" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#38BDF8" />
    <text x="28" y="21" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">ZAPRET WINWS</text>
  </g>

  <!-- Badge 3: Wintun TUN -->
  <g transform="translate(474, 150)">
    <rect width="128" height="32" rx="10" fill="#141824" stroke="#283548" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#818CF8" />
    <text x="28" y="21" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">WINTUN TUN</text>
  </g>

  <!-- Badge 4: WPF .NET 10 -->
  <g transform="translate(612, 150)">
    <rect width="128" height="32" rx="10" fill="#141824" stroke="#283548" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#F43F5E" />
    <text x="28" y="21" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#E2E8F0">WPF .NET 10</text>
  </g>

  <!-- Badge 5: PORTABLE EDITION -->
  <g transform="translate(750, 150)">
    <rect width="105" height="32" rx="10" fill="#1D2818" stroke="#365314" stroke-width="1" />
    <text x="14" y="21" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#84CC16">PORTABLE ✓</text>
  </g>

  <!-- Status Light (top right) -->
  <g transform="translate(760, 48)">
    <rect width="95" height="26" rx="8" fill="#111B15" stroke="#166534" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22C55E" />
    <text x="26" y="17" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#4ADE80">ONLINE v1.0</text>
  </g>
</svg>
