<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="100%" height="370">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080F" />
      <stop offset="100%" stop-color="#0E0E18" />
    </linearGradient>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75" />
    </filter>

    <style>
      @keyframes fadeInLine {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes statusPulse {
        0%, 100% { fill: #22C55E; filter: drop-shadow(0 0 4px #22C55E); }
        50% { fill: #4ADE80; filter: drop-shadow(0 0 10px #4ADE80); }
      }
      .l1 { animation: fadeInLine 0.4s ease-out 0.3s forwards; opacity: 0; }
      .l2 { animation: fadeInLine 0.4s ease-out 0.9s forwards; opacity: 0; }
      .l3 { animation: fadeInLine 0.4s ease-out 1.5s forwards; opacity: 0; }
      .l4 { animation: fadeInLine 0.4s ease-out 2.1s forwards; opacity: 0; }
      .l5 { animation: fadeInLine 0.4s ease-out 2.7s forwards; opacity: 0; }
      .l6 { animation: fadeInLine 0.4s ease-out 3.3s forwards; opacity: 0; }
      .l7 { animation: fadeInLine 0.4s ease-out 3.9s forwards; opacity: 0; }
      .l8 { animation: fadeInLine 0.4s ease-out 4.5s forwards; opacity: 0; }
      .cursor { animation: blinkCursor 0.9s infinite; }
      .live-dot { animation: statusPulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Terminal Window Body -->
  <rect x="2" y="2" width="836" height="366" rx="14" fill="url(#termBg)" stroke="#1F1F32" stroke-width="1.5" filter="url(#termShadow)" />

  <!-- Terminal Header / Title Bar -->
  <path d="M2 16 Q2 2 16 2 L824 2 Q838 2 838 16 L838 42 L2 42 Z" fill="#131320" />
  <line x1="2" y1="42" x2="838" y2="42" stroke="#222234" stroke-width="1" />

  <!-- macOS Window Controls (Traffic Lights) -->
  <circle cx="22" cy="22" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5" />
  <circle cx="42" cy="22" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5" />
  <circle cx="62" cy="22" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5" />

  <!-- Title & Status Pill -->
  <text x="420" y="27" font-family="'Consolas', 'Cascadia Code', monospace" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">
    tunnel.log — Velora Terminal Session
  </text>
  <circle cx="795" cy="22" r="4.5" class="live-dot" />
  <text x="782" y="26" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#22C55E" text-anchor="end">
    LIVE
  </text>

  <!-- Console Log Lines (Monospace) -->
  <g font-family="'Consolas', 'Cascadia Code', 'Fira Code', monospace" font-size="12.5" letter-spacing="0.3">
    <!-- Line 1 -->
    <g class="l1" transform="translate(26, 75)">
      <text fill="#64748B">[22:15:01]</text>
      <text x="95" fill="#38BDF8">[SYSTEM]</text>
      <text x="180" fill="#E2E8F0">Velora v1.0.0 initializing on Windows 11 x64 (Build 26100)...</text>
    </g>

    <!-- Line 2 -->
    <g class="l2" transform="translate(26, 107)">
      <text fill="#64748B">[22:15:02]</text>
      <text x="95" fill="#818CF8">[SECURITY]</text>
      <text x="180" fill="#CBD5E1">DPAPI encrypted vault unlocked. 4 server profiles loaded.</text>
    </g>

    <!-- Line 3 -->
    <g class="l3" transform="translate(26, 139)">
      <text fill="#64748B">[22:15:03]</text>
      <text x="95" fill="#F59E0B">[ZAPRET]</text>
      <text x="180" fill="#CBD5E1">Fix Internet ready: 20 DPI strategies, 70+ built-in sites, Game UDP filter.</text>
    </g>

    <!-- Line 4 -->
    <g class="l4" transform="translate(26, 171)">
      <text fill="#64748B">[22:15:04]</text>
      <text x="95" fill="#06B6D4">[CORE]</text>
      <text x="180" fill="#CBD5E1">Spawning Sing-Box 1.10.7 kernel with VLESS Reality &amp; XTLS Vision...</text>
    </g>

    <!-- Line 5 -->
    <g class="l5" transform="translate(26, 203)">
      <text fill="#64748B">[22:15:05]</text>
      <text x="95" fill="#10B981">[TUNNEL]</text>
      <text x="180" fill="#CBD5E1">Wintun virtual adapter active (IP: 172.19.0.1, MTU: 1420, Strict Route: ON).</text>
    </g>

    <!-- Line 6 -->
    <g class="l6" transform="translate(26, 235)">
      <text fill="#64748B">[22:15:06]</text>
      <text x="95" fill="#EC4899">[ROUTING]</text>
      <text x="180" fill="#CBD5E1">Split tunneling: Russian resources direct, blocked services via tunnel.</text>
    </g>

    <!-- Line 7 -->
    <g class="l7" transform="translate(26, 267)">
      <text fill="#64748B">[22:15:07]</text>
      <text x="95" fill="#22C55E">[CONNECTED]</text>
      <text x="180" fill="#86EFAC">Tunnel established! Frankfurt #1 (Reality) · Ping: 17ms · 0% loss.</text>
    </g>

    <!-- Line 8 -->
    <g class="l8" transform="translate(26, 305)">
      <rect x="0" y="-18" width="788" height="28" rx="6" fill="#162024" stroke="#234E45" stroke-width="1" />
      <text x="14" y="2" fill="#65E5BF" font-weight="700">● ACTIVE TUNNEL</text>
      <text x="150" y="2" fill="#94A3B8">| Speed: </text>
      <text x="215" y="2" fill="#38BDF8" font-weight="700">142.8 Mbps ↓</text>
      <text x="325" y="2" fill="#A78BFA" font-weight="700">94.5 Mbps ↑</text>
      <text x="435" y="2" fill="#94A3B8">| Mode: </text>
      <text x="490" y="2" fill="#FACC15" font-weight="700">Wintun TUN (Full)</text>
      <text x="660" y="2" fill="#65E5BF" class="cursor">█</text>
    </g>
  </g>
</svg>
